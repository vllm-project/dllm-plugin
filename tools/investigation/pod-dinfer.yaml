apiVersion: v1
kind: Pod
metadata:
  name: investigation-dinfer
  labels:
    app: investigation-dinfer
    purpose: numerical-investigation
spec:
  activeDeadlineSeconds: 14400  # 4 hour TTL for exhaustive capture
  restartPolicy: Never

  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: jounce.io/nodetype
      operator: Equal
      value: A100-40
      effect: NoSchedule

  containers:
    - name: dinfer-capture
      image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
      command: ["/bin/bash", "-c", "sleep 14400"]

      resources:
        requests:
          nvidia.com/gpu: 1
          memory: "48Gi"
          cpu: "8"
          ephemeral-storage: "100Gi"
        limits:
          nvidia.com/gpu: 1
          memory: "48Gi"
          cpu: "8"

      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: CUDA_LAUNCH_BLOCKING
          value: "0"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "max_split_size_mb:512"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: TRANSFORMERS_CACHE
          value: "/workspace/.cache/huggingface"
        - name: HF_HOME
          value: "/workspace/.cache/huggingface"

      volumeMounts:
        - name: workspace
          mountPath: /workspace

  volumes:
    - name: workspace
      emptyDir: {}
