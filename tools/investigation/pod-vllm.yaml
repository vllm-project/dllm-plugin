apiVersion: v1
kind: Pod
metadata:
  name: investigation-vllm
  labels:
    app: investigation-vllm
    purpose: numerical-investigation
spec:
  activeDeadlineSeconds: 14400  # 4 hour TTL for exhaustive capture
  restartPolicy: Never

  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: jounce.io/nodetype
      operator: Equal
      value: A100-40
      effect: NoSchedule

  containers:
    - name: vllm-capture
      image: vllm/vllm-openai:v0.20.2
      command: ["/bin/bash", "-c", "sleep 14400"]

      resources:
        requests:
          nvidia.com/gpu: 1
          memory: "96Gi"
          cpu: "12"
          ephemeral-storage: "100Gi"
        limits:
          nvidia.com/gpu: 1
          memory: "96Gi"
          cpu: "12"

      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: CUDA_LAUNCH_BLOCKING
          value: "0"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "max_split_size_mb:512"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: TRANSFORMERS_CACHE
          value: "/workspace/.cache/huggingface"
        - name: HF_HOME
          value: "/workspace/.cache/huggingface"
        - name: VLLM_PLUGINS
          value: "dllm"
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
        - name: VLLM_ENABLE_V1_MULTIPROCESSING
          value: "0"
        - name: VLLM_DLLM_USE_MOCK_MODEL
          value: "0"

      volumeMounts:
        - name: workspace
          mountPath: /workspace

  volumes:
    - name: workspace
      emptyDir: {}
