apiVersion: v1
kind: Pod
metadata:
  name: sglang-benchmark
  labels:
    app: sglang-benchmark
spec:
  activeDeadlineSeconds: 7200  # 2 hour TTL
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: jounce.io/nodetype
      operator: Equal
      value: A100-40
      effect: NoSchedule
  containers:
    - name: sglang
      image: lmsysorg/sglang:latest
      command:
        - python3
        - -m
        - sglang.launch_server
        - --model-path
        - inclusionAI/LLaDA2.0-mini
        - --host
        - "0.0.0.0"
        - --port
        - "8001"
        - --max-total-tokens
        - "2048"
        - --trust-remote-code
      ports:
        - containerPort: 8001
          name: http
      resources:
        limits:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: 1
        requests:
          cpu: "8"
          memory: 64Gi
          ephemeral-storage: 80Gi
          nvidia.com/gpu: 1
