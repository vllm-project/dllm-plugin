apiVersion: v1
kind: Pod
metadata:
  name: vllm-server
  namespace: dllm
  labels:
    app: vllm-server
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: jounce.io/nodetype
      operator: Equal
      value: L4
      effect: NoSchedule
  containers:
    - name: server
      image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
      command:
        - bash
        - -c
        - |
          set -euo pipefail
          apt-get update && apt-get install -y git curl

          # Install uv
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          # Clone repo and checkout branch
          git clone https://github.com/vllm-project/dllm-plugin.git /app
          cd /app
          git checkout feat/phase7-llada2-real-model

          # Install dependencies
          uv sync --extra vllm

          # Set up environment
          export VLLM_PLUGINS=dllm
          export VLLM_USE_V2_MODEL_RUNNER=1
          export VLLM_ENABLE_V1_MULTIPROCESSING=0
          export VLLM_DLLM_USE_MOCK_MODEL=1  # Use mock for faster startup

          # Start server
          uv run vllm serve tests/fixtures/mock_llada2_hf_config \
            --tokenizer tests/fixtures/mock_llada2_hf_config \
            --host 0.0.0.0 \
            --port 8000 \
            --max-model-len 128 \
            --enforce-eager \
            --served-model-name dllm-benchmark \
            --load-format dummy \
            --worker-cls dllm_plugin.Worker \
            --gpu-memory-utilization 0.35 \
            --max-num-seqs 1 \
            --scheduler-cls dllm_plugin.Scheduler
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
